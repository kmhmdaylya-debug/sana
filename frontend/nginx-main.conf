# پیکربندی اصلی nginx برای فرانت‌اند سنا
#
# تفاوت با nginx.conf پیش‌فرض تصویر رسمی:
#  * بدون دستور `user` — کانتینر با کاربر غیرریشه (sana) اجرا می‌شود و این دستور
#    فقط هشدار ایجاد می‌کند.
#  * مسیر pid روی /tmp قرار دارد چون /run متعلق به root است و کاربر sana
#    مجاز به نوشتن در آن نیست (خطای: open() "/run/nginx.pid" failed: Permission denied).

worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
