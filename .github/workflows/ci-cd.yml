name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deployment target'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================================================
  # LINT AND TYPE CHECK
  # ==========================================================================
  lint-and-typecheck:
    name: Lint & TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run backend lint
        run: cd backend && npm run lint

      - name: Run frontend lint
        run: cd frontend && npm run lint

      - name: Run backend TypeScript check
        run: cd backend && npx tsc --noEmit

      - name: Run frontend TypeScript check
        run: cd frontend && npx tsc --noEmit

  # ==========================================================================
  # BACKEND TESTS
  # ==========================================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sana
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: sana_hrms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Generate Prisma Client
        run: cd backend && npx prisma generate

      - name: Run migrations
        run: cd backend && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://sana:test123@localhost:5432/sana_hrms_test?schema=public

      - name: Run backend unit tests
        run: cd backend && npm test -- --passWithNoTests
        env:
          DATABASE_URL: postgresql://sana:test123@localhost:5432/sana_hrms_test?schema=public
          NODE_ENV: test
          JWT_ACCESS_SECRET: test-access-secret-minimum-32-characters-long
          JWT_REFRESH_SECRET: test-refresh-secret-minimum-32-characters-long
          JWT_REFRESH_GRACE_SECONDS: 5
          JWT_ISSUER: sana-hrms-test
          BACKUP_ENCRYPTION_KEY: test-backup-encryption-key-32-chars!!
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: TestPass123!
          AUDIT_FAIL_OPEN: 'true'
          AUDIT_ALERT_ON_FAILURE: 'true'

      - name: Upload backend coverage
        uses: codecov/codecov-action@v3
        with:
          directory: backend/coverage
          flags: backend
          files: backend/coverage/lcov.info

  # ==========================================================================
  # FRONTEND TESTS
  # ==========================================================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run frontend unit tests
        run: cd frontend && npm test -- --passWithNoTests

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v3
        with:
          directory: frontend/coverage
          flags: frontend
          files: frontend/coverage/lcov.info

  # ==========================================================================
  # SECURITY SCANS
  # ==========================================================================
  security-scans:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Audit backend dependencies
        run: cd backend && npm audit --audit-level=high
        continue-on-error: true

      - name: Audit frontend dependencies
        run: cd frontend && npm audit --audit-level=high
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # ==========================================================================
  # DOCKER BUILD
  # ==========================================================================
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, backend-tests, frontend-tests, security-scans]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # INTEGRATION TESTS (with Docker Compose)
  # ==========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate secrets for testing
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -base64 24)" >> $GITHUB_ENV
          echo "JWT_ACCESS_SECRET=$(openssl rand -base64 48 | tr -d '=+/' | cut -c1-64)" >> $GITHUB_ENV
          echo "JWT_REFRESH_SECRET=$(openssl rand -base64 48 | tr -d '=+/' | cut -c1-64)" >> $GITHUB_ENV
          echo "BACKUP_ENCRYPTION_KEY=$(openssl rand -base64 48 | tr -d '=+/' | cut -c1-64)" >> $GITHUB_ENV
          echo "ADMIN_PASSWORD=$(openssl rand -base64 32 | tr -d '=+/' | cut -c1-20)Aa1!" >> $GITHUB_ENV
          echo "CORS_ORIGINS=http://localhost:8080" >> $GITHUB_ENV
          echo "TRUSTED_PROXIES=127.0.0.1" >> $GITHUB_ENV

      - name: Start services with Docker Compose
        run: |
          docker compose -f docker-compose.yml up -d --build --wait --wait-timeout 180

      - name: Verify health checks
        run: |
          sleep 10
          curl -f http://localhost:8080/health
          curl -f http://localhost:8080/api/v1/health/ready

      - name: Run integration tests
        run: |
          cd backend && npm run test:integration
        env:
          DATABASE_URL: postgresql://sana:${{ env.POSTGRES_PASSWORD }}@localhost:5432/sana_hrms?schema=public
          BACKUP_RESTORE_DATABASE_URL: postgresql://sana:${{ env.POSTGRES_PASSWORD }}@localhost:5432/sana_restore?schema=public

      - name: Cleanup
        if: always()
        run: docker compose down -v

  # ==========================================================================
  # STAGING DEPLOYMENT
  # ==========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add actual staging deployment commands here
          # Example: kubectl apply -f k8s/staging/
          # Or: ssh to staging server and run docker compose pull && docker compose up -d

  # ==========================================================================
  # PRODUCTION DEPLOYMENT (Manual Approval)
  # ==========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'production'
    environment: production
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add actual production deployment commands here
          # Requires manual approval via environment protection rules

      - name: Verify production deployment
        run: |
          echo "Verifying production deployment..."
          # Add health check verification

      - name: Notify deployment
        run: |
          echo "Production deployment completed successfully!"
          # Add notification (Slack, email, etc.)