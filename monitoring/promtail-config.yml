server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log

  - job_name: sana-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: sana-backend
          __path__: /data/sana/logs/backend/*.log

  - job_name: sana-frontend
    static_configs:
      - targets:
          - localhost
        labels:
          job: sana-frontend
          __path__: /data/sana/logs/frontend/*.log

  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          __path__: /var/log/nginx/*.log

  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - docker: {}
      - labels:
          container_name:
      - match:
          selector: '{container_name=~"sana-.*"}'
          action: keep