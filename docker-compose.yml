# ==========================================================================
# سامانه مدیریت منابع انسانی «سنا» — Docker Compose (تولید)
#
# قبل از اجرا، این متغیرها را در محیط (یا فایل .env کنار همین فایل) تنظیم کنید:
#   POSTGRES_PASSWORD, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET,
#   BACKUP_ENCRYPTION_KEY, ADMIN_PASSWORD
# مقدارها را با scripts/generate-secrets.ps1 بسازید. اگر تنظیم نشده باشند،
# docker compose با خطا متوقف می‌شود (هیچ مقدار پیش‌فرضی وجود ندارد).
#
# اجرای کامل: docker compose up -d --build
# فقط پایگاه داده (توسعه): docker compose up -d db
# ==========================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: sana-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD را تنظیم کنید}
      POSTGRES_DB: sana_hrms
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    # پایگاه داده فقط در شبکه داخلی در دسترس است (پورت روی میزبان باز نمی‌شود)
    expose:
      - "5432"
    volumes:
      - sana-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sana -d sana_hrms"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  backend:
    build: ./backend
    container_name: sana-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4114
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://sana:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD را تنظیم کنید}@db:5432/sana_hrms?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET را تنظیم کنید}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET را تنظیم کنید}
      JWT_REFRESH_GRACE_SECONDS: 5
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KEY را تنظیم کنید}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD را تنظیم کنید}
      SEED_DEMO_DATA: "false"
      SWAGGER_ENABLED: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS را تنظیم کنید}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1}
      TZ: ${TZ:-Asia/Tehran}
    # فقط از طریق nginx (فرانت) در دسترس است؛ پورت API روی میزبان باز نمی‌شود
    expose:
      - "4114"
    volumes:
      - sana-backups:/app/backups
      - sana-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4114/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  frontend:
    build: ./frontend
    container_name: sana-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8080:80"
    # nginx داخل کانتینر، /api را به backend پراکسی می‌کند
    environment:
      TZ: ${TZ:-Asia/Tehran}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Reverse proxy برای TLS termination (اختیاری - در تولید با Nginx/Traefik/Caddy جایگزین شود)
  # proxy:
  #   image: nginx:alpine
  #   container_name: sana-proxy
  #   restart: unless-stopped
  #   depends_on:
  #     - frontend
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./proxy/certs:/etc/nginx/certs:ro
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '0.5'
  #         memory: 128M

volumes:
  sana-pgdata:
  sana-backups:
  sana-uploads:
